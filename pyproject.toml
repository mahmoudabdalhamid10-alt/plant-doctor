[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-doctor"
version = "0.1.0"
description = "Plant Doctor (دكتور النبات): leaf-photo disease diagnosis with Arabic treatment advice"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
